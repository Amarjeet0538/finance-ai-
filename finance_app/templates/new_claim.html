{% extends "base.html" %}

{% block title %}File Expense Claim{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 1rem auto;">
    <h2 style="margin-bottom: 1rem;">File New Expense Claim</h2>

    {% if error %}
        <div class="alert alert-error" id="form-error-banner">
            <strong>Validation Error:</strong> {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/claims/new" id="claim-form">
        <div class="form-group">
            <label for="employee">Employee Name *</label>
            <input type="text" id="employee" name="employee" required value="{{ employee or 'Priya Sharma' }}">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="date">Claim Date (YYYY-MM-DD) *</label>
                <input type="date" id="date" name="date" required value="{{ date or '' }}">
            </div>

            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    <option value="" disabled {% if not category %}selected{% endif %}>Select category...</option>
                    <option value="Meals" {% if category == 'Meals' %}selected{% endif %}>Meals</option>
                    <option value="Cab" {% if category == 'Cab' %}selected{% endif %}>Cab</option>
                    <option value="Flight" {% if category == 'Flight' %}selected{% endif %}>Flight</option>
                    <option value="Lodging" {% if category == 'Lodging' %}selected{% endif %}>Lodging</option>
                    <option value="Software" {% if category == 'Software' %}selected{% endif %}>Software</option>
                    <option value="Client entertainment" {% if category == 'Client entertainment' %}selected{% endif %}>Client entertainment</option>
                    <option value="Other" {% if category == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="amount_inr">Amount (INR ₹) *</label>
                <input type="number" step="0.01" id="amount_inr" name="amount_inr" required value="{{ amount_inr or '' }}">
            </div>

            <div class="form-group">
                <label for="vendor">Vendor / Merchant *</label>
                <input type="text" id="vendor" name="vendor" required value="{{ vendor or '' }}">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="cost_center">Cost Center *</label>
                <input type="text" id="cost_center" name="cost_center" placeholder="e.g. CC-42" value="{{ cost_center or '' }}">
                <small style="color: var(--text-muted); font-size: 0.8rem;">Required per company policy.</small>
            </div>

            <div class="form-group">
                <label for="receipt_id">Receipt Identifier</label>
                <input type="text" id="receipt_id" name="receipt_id" placeholder="e.g. REC-01" value="{{ receipt_id or '' }}">
            </div>
        </div>

        <div class="form-group">
            <label for="description">Business Justification / Description</label>
            <textarea id="description" name="description" rows="3">{{ description or '' }}</textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn" id="submit-claim-button">Submit Claim</button>
            <a href="/claims" class="btn" style="background-color: var(--border-color);">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
