[project]
name = "centralign"
version = "0.1.0"
description = "Autonomous Company Operator for expense claims processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "playwright>=1.45.0",
    "anthropic>=0.34.0",
    "portalocker>=2.10.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "finance_app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
